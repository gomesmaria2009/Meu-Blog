<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Blog Tech</title>

  <style>
    /* ===== ESTILOS GERAIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f7fb;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    /* ===== CABEÇALHO ===== */
    header {
      background-color: #183C63;
      color: #FFFFFF;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      border: 5px solid #cf1010;
      border-radius: 12px 12px 0 0;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-top: 6px;
    }

    /* ===== CONTEÚDO PRINCIPAL ===== */
    main {
      background-color: #FFFFFF;
      color: #183C63;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
      border-left: 5px solid #cf1010;
      border-right: 5px solid #cf1010;
      border-bottom: 5px solid #cf1010;
      border-radius: 0 0 12px 12px;
    }

    main h2 {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .artigo-autor {
      font-weight: bold;
      color: #2a5f7a;
      margin-bottom: 12px;
    }

    main p {
      line-height: 1.6;
      font-size: 1rem;
    }

    /* ===== RODAPÉ (opcional) ===== */
    footer {
      max-width: 800px;
      margin: 16px auto 0;
      text-align: center;
      color: #7a8fa3;
      font-size: 0.9rem;
      padding: 8px;
      border-top: 2px solid #183C63;
    }
  </style>
</head>

<body>

  <!-- ESTRUTURA DO BLOG -->
  <div style="width:100%; display:flex; flex-direction:column; align-items:center;">

    <!-- CABEÇALHO -->
    <header>
      <h1>📘 Meu blog tech</h1>
      <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: Maria Eduarda Gomes</p>
      <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
    </main>

    <!-- RODAPÉ (opcional) -->
    <footer>
      <p>© 2026 – Blog da Maria Eduarda | Todos os direitos reservados</p>
    </footer>

  </div>

</body>
</html>
